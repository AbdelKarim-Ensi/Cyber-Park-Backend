<div class="form-container">
  <header class="form-header">
    <h2 class="form-header__title">Demande de congé</h2>
    <p class="form-header__description">Veuillez remplir les détails de votre absence.</p>
  </header>

  <form [formGroup]="leaveForm" (ngSubmit)="onSubmit()">
    <div class="form-body">
      
      <div class="form-group">
        <label for="leaveType" class="form-label">Type de congé <span class="form-label__required">*</span></label>
        <select id="leaveType" formControlName="type" class="form-control">
          <option value="" disabled selected>Sélectionnez une catégorie</option>
          <option value="ANNUAL">Congé Annuel</option>
          <option value="SICK">Congé Maladie</option>
          <option value="MATERNITY">Congé Maternité</option>
          <option value="UNPAID">Congé Sans Solde</option>
          <option value="OTHER">Autre</option>
        </select>
        <small *ngIf="leaveForm.get('type')?.touched && leaveForm.get('type')?.invalid" class="error-text">
          Le type de congé est requis.
        </small>
      </div>

      <div class="form-group">
  <label for="startDate" class="form-label">Date de début <span class="form-label__required">*</span></label>
  <input type="date" id="startDate" formControlName="startDate" class="form-control" [class.dark-calendar]="isDarkMode">
  <small *ngIf="leaveForm.get('startDate')?.touched && leaveForm.get('startDate')?.invalid" class="error-text">
    La date de début est requise.
  </small>
</div>

<div class="form-group">
  <label for="endDate" class="form-label">Date de fin <span class="form-label__required">*</span></label>
  <input type="date" id="endDate" formControlName="endDate" class="form-control" [class.dark-calendar]="isDarkMode">
  <small *ngIf="leaveForm.get('endDate')?.touched && leaveForm.get('endDate')?.invalid" class="error-text">
    La date de fin est requise.
  </small>
</div>

      <div class="form-group form-group--full">
        <label for="reason" class="form-label">Motif / Justification <span class="form-label__required">*</span></label>
        <textarea 
          id="reason" 
          formControlName="reason" 
          class="form-control" 
          rows="4" 
          placeholder="Détaillez la raison de votre demande..."></textarea>
        <small *ngIf="leaveForm.get('reason')?.touched && leaveForm.get('reason')?.invalid" class="error-text">
          Le motif de votre absence est obligatoire.
        </small>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn--cancel" (click)="onCancel()">Annuler</button>
        <button type="submit" class="btn btn--save">Soumettre la demande</button>
      </div>
      
    </div>
  </form>
</div>
