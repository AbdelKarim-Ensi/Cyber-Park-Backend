<article class="employee-card animate-fade-in" aria-labelledby="attendance-form-title">
  <header class="employee-card__header">
    <h1 id="attendance-form-title" class="employee-card__title">Modifier un Pointage</h1>
    <p class="employee-card__description">Modifiez les détails du registre de présence pour l'employé sélectionné.</p>
  </header>

  <form class="employee-form" [formGroup]="attendanceForm" (ngSubmit)="onSubmit()" novalidate>

    <div class="form-group full-width">
      <label class="form-label">Employé</label>
      <input type="text" class="form-input" [value]="employeeName" disabled style="font-weight: 600; opacity: 0.8;">
    </div>

    <div class="form-group">
      <label for="date" class="form-label">Date d'enregistrement <span class="required">*</span></label>
      <input type="date" id="date" formControlName="date" class="form-input" [class.dark-calendar]="isDarkMode">
      <span class="error-text" *ngIf="attendanceForm.get('date')?.touched && attendanceForm.get('date')?.invalid">
        La date est requise
      </span>
    </div>

    <div class="form-group">
      <label for="status" class="form-label">Statut de la journée <span class="required">*</span></label>
      <select id="status" formControlName="status" class="form-select">
        <option value="" disabled>-- Choisir un statut --</option>
        <option value="PRESENT">Présent</option>
        <option value="ABSENT">Absent</option>
        <option value="LATE">En retard</option>
        <option value="HALF_DAY">Demi-journée</option>
      </select>
      <span class="error-text" *ngIf="attendanceForm.get('status')?.touched && attendanceForm.get('status')?.invalid">
        Veuillez sélectionner un statut
      </span>
    </div>

    <div class="form-group">
      <label for="checkIn" class="form-label">
        Heure d'arrivée (Check-In) 
        <span class="required" *ngIf="attendanceForm.get('status')?.value !== 'ABSENT'">*</span>
      </label>
      <input type="time" id="checkIn" formControlName="checkIn" class="form-input" [class.dark-calendar]="isDarkMode">
      <span class="error-text" *ngIf="attendanceForm.get('checkIn')?.touched && attendanceForm.get('checkIn')?.invalid">
        L'heure d'arrivée est obligatoire
      </span>
    </div>

    <div class="form-group">
      <label for="checkOut" class="form-label">Heure de départ (Check-Out)</label>
      <input type="time" id="checkOut" formControlName="checkOut" class="form-input" [class.dark-calendar]="isDarkMode">
    </div>

    <div class="form-group full-width">
      <label for="notes" class="form-label">Notes Additionnelles / Justifications</label>
      <textarea id="notes" formControlName="notes" class="form-input textarea-input" rows="4" placeholder="Ajoutez des détails ou modifications (optionnel)"></textarea>
    </div>

    <div class="form-actions">
      <button type="button" class="btn btn--cancel" routerLink="/home/attendance">Annuler</button>
      <button type="submit" class="btn btn--save" [disabled]="attendanceForm.invalid">Enregistrer les modifications</button>
    </div>

  </form>
</article>
