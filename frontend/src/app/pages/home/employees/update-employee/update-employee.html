<article class="employee-card" aria-labelledby="employee-form-title">
  <header class="employee-card__header">
    <h1 id="employee-form-title" class="employee-card__title">Ajouter un employé</h1>
    <p class="employee-card__description">Remplissez les informations ci-dessous pour créer la fiche de l'employé.</p>
  </header>

  <form class="employee-form" [formGroup]="employeeForm" (ngSubmit)="onSubmit()" novalidate>
    <div class="form-group">
      <label for="firstName" class="form-label">Prénom</label>
      <input type="text" id="firstName" formControlName="firstName" class="form-input" placeholder="Ex. Marie" autocomplete="given-name">
    </div>

    <div class="form-group">
      <label for="lastName" class="form-label">Nom</label>
      <input type="text" id="lastName" formControlName="lastName" class="form-input" placeholder="Ex. Dupont" autocomplete="family-name">
    </div>

    <div class="form-group">
      <label for="email" class="form-label">Email professionnel</label>
      <input type="email" id="email" formControlName="email" class="form-input" placeholder="marie.dupont@entreprise.fr" autocomplete="email">
    </div>

    <div class="form-group">
      <label for="role" class="form-label">Poste / Rôle</label>
      <input type="text" id="role" formControlName="role" class="form-input" placeholder="Ex. Développeuse front-end">
    </div>

    <div class="form-group">
      <label for="department" class="form-label">Département</label>
      <select id="department" formControlName="department" class="form-select">
        <option value="" disabled selected>Sélectionnez un département</option>
        
        @for(dept of departments; track dept._id) {
          <option [value]="dept._id">{{ dept.name }}</option>
        }
      </select>
    </div>

   <div class="form-group">
      <label for="joinDate" class="form-label">Date d'embauche </label>
      <input type="date" id="joinDate" formControlName="joinDate" class="form-input" [class.dark-calendar]="isDarkMode">
      <small *ngIf="employeeForm.get('joinDate')?.touched && employeeForm.get('joinDate')?.invalid" class="error-text">
    La date de début est requise.
  </small>
    </div>

    <div class="form-group">
      <label for="status" class="form-label">Statut</label>
      <select id="status" formControlName="status" class="form-select">
        <option value="" disabled selected>Sélectionnez un statut</option>
        <option value="ACTIVE">Actif</option>
        <option value="INACTIVE">Inactif</option>
      </select>
    </div>

    <div class="form-actions">
      <button type="button" class="btn btn--cancel" (click)="onCancel()">Annuler</button>
      <button type="submit" class="btn btn--save" [disabled]="employeeForm.invalid">Enregistrer</button>
    </div>
  </form>
</article>
