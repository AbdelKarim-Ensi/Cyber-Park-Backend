<div class="page-container">
  
  <div class="employee-card">
    <div class="employee-card__header">
      <h2 class="employee-card__title">Créer une annonce</h2>
      <p class="employee-card__description">
        Renseignez les détails de la nouvelle annonce à diffuser.
      </p>
    </div>

    <form [formGroup]="announcementForm" (ngSubmit)="onSubmit()" class="project-form">
      
      <div class="form-group">
        <label class="form-label" for="title">Titre de l'annonce <span class="required">*</span></label>
        <input id="title" class="form-input" type="text" formControlName="title" placeholder="Ex: Lancement du projet Alpha" />
        <span class="error-text" *ngIf="announcementForm.get('title')?.touched && announcementForm.get('title')?.invalid">Requis</span>
      </div>

      <div class="form-group">
        <label class="form-label" for="target">Cible de diffusion <span class="required">*</span></label>
        <select id="target" class="form-select" formControlName="target">
          <option value="" disabled selected>-- Choisir une cible --</option>
          <option *ngFor="let opt of targetOptions" [value]="opt.value">{{ opt.label }}</option>
        </select>
        <span class="error-text" *ngIf="announcementForm.get('target')?.touched && announcementForm.get('target')?.invalid">Requis</span>
        <!-- NOUVEAU : indication pour les employés sur la restriction de cible -->
        
      </div>

      <div class="form-group full-width">
        <label class="form-label" for="image">URL de l'image (Optionnelle)</label>
        <input id="image" class="form-input" type="url" formControlName="image" placeholder="Ex: https://images.com/illustration.png" />
      </div>

      <div class="form-group full-width">
        <label class="form-label" for="content">Contenu de l'annonce <span class="required">*</span></label>
        <textarea id="content" class="form-input textarea-input" formControlName="content" placeholder="Saisissez le texte complet de votre annonce ici..." rows="5"></textarea>
        <span class="error-text" *ngIf="announcementForm.get('content')?.touched && announcementForm.get('content')?.invalid">Requis</span>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn--cancel" (click)="onCancel()">Annuler</button>
        <button type="submit" class="btn btn--save" [disabled]="announcementForm.invalid">Créer l'annonce</button>
      </div>

    </form>
  </div>
</div>
