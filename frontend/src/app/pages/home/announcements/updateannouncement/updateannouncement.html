<div class="page-container">
  
  <div class="employee-card">
    <div class="employee-card__header">
      <h2 class="employee-card__title">Modifier l'annonce</h2>
      <p class="employee-card__description">
        Ajustez le contenu, la visibilité ou l'illustration de votre annonce.
      </p>
    </div>

    <form [formGroup]="announcementForm" (ngSubmit)="onSubmit()" class="project-form">

      <div class="form-group">
        <label class="form-label" for="title">Titre de l'annonce <span class="required">*</span></label>
        <input id="title" class="form-input" type="text" formControlName="title" placeholder="Ex: Réunion générale trimestrielle" />
        <span class="error-text" *ngIf="announcementForm.get('title')?.touched && announcementForm.get('title')?.invalid">Le titre de l'annonce est obligatoire.</span>
      </div>

      <div class="form-group">
        <label class="form-label" for="target">Audience cible <span class="required">*</span></label>
        <select id="target" class="form-select" formControlName="target">
          <option value="PUBLIC">PUBLIC (Tout le monde)</option>
          <option value="INTERNAL_ALL">INTERNAL (Employés uniquement)</option>
          <option value="ADMIN_ONLY">ADMIN ONLY (Administrateurs)</option>
        </select>
        <span class="error-text" *ngIf="announcementForm.get('target')?.touched && announcementForm.get('target')?.invalid">Requis</span>
      </div>

      <div class="form-group full-width">
        <label class="form-label" for="image">URL de l'image (optionnelle)</label>
        <input id="image" class="form-input" type="url" formControlName="image" placeholder="https://exemple.com/image.jpg" />
      </div>

      <div class="form-group full-width">
        <label class="form-label" for="content">Contenu de l'annonce <span class="required">*</span></label>
        <textarea id="content" class="form-input textarea-input" formControlName="content" placeholder="Rédigez le message détaillé à transmettre aux collaborateurs..." rows="5"></textarea>
        <span class="error-text" *ngIf="announcementForm.get('content')?.touched && announcementForm.get('content')?.invalid">Le contenu du message ne peut pas être vide.</span>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn--cancel" routerLink="/home/announcements">Annuler</button>
        <button type="submit" class="btn btn--save" [disabled]="announcementForm.invalid">Mettre à jour</button>
      </div>

    </form>
  </div>
</div>
