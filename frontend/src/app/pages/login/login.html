<div [ngClass]="isDarkMode ? 'dark-theme' : 'light-theme'" class="login-wrapper">
  
 <button class="theme-toggle-icon" (click)="toggleTheme()" type="button" aria-label="Changer de thème">
    <span *ngIf="isDarkMode">☀️</span>
    <span *ngIf="!isDarkMode">🌙</span>
  </button>

  <div class="login-card">
    
    <div class="brand-logo">
      <div class="logo-box">C</div>
      <span class="brand-name">Cyber Park</span>
    </div>
    
    <div class="login-header">
      <h1>Connexion</h1>
      <p>Bienvenue ! Renseignez vos identifiants pour continuer.</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      
      <div class="form-group">
        <label for="email">Adresse e-mail</label>
        <input 
          type="email" 
          id="email" 
          formControlName="email" 
          placeholder="nom@exemple.com"
          [class.is-invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
        >
        
        <span class="error-msg" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
          Veuillez entrer une adresse e-mail valide.
        </span>
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input 
          type="password" 
          id="password" 
          formControlName="password" 
          placeholder="••••••••"
          [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
        >
        
        <span class="error-msg" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          Le mot de passe est requis (min. 6 caractères).
        </span>
      </div>

      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox"> Se souvenir de moi
        </label>
        <a routerLink="/forgot-password" class="forgot-link">Mot de passe oublié ?</a>
      </div>

      <button type="submit" class="btn-submit" [disabled]="loginForm.invalid">
        Se connecter
      </button>
    </form>

    <!-- AJOUT : séparateur + bouton Google -->
    <div class="divider">
      <span>ou</span>
    </div>

    <button
      type="button"
      class="btn-google"
      (click)="onGoogleLogin()"
      [disabled]="isGoogleLoading"
    >
      <svg *ngIf="!isGoogleLoading" width="18" height="18" viewBox="0 0 48 48">
        <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12s5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24s8.955,20,20,20s20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
        <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
        <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
        <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>
      </svg>
      <span *ngIf="isGoogleLoading" class="spinner"></span>
      {{ isGoogleLoading ? 'Connexion...' : 'Se connecter avec Google' }}
    </button>

   

  </div>
</div>
